seed: 7
model_type: rcs_ac_first
model_variant: ppo_same_env_sensor_action_baseline_lowstd
training_stage: ppo_clean_same_env_sensor_action_seed7_lowstd_smoke
run_name: ppo_clean_same_env_sensor_action_seed7_lowstd_smoke
town: Town04
host: 127.0.0.1
port: 2000
device: auto
total_timesteps: 2048
rollout_steps: 128
max_episode_steps: 512
save_every_updates: 1
logs_dir: logs
checkpoints_dir: checkpoints
output_root: outputs/ppo_clean_same_env_sensor_action_seed7_lowstd_env

contract:
  stage: ppo_same_env_sensor_action_baseline
  observation_contract_version: medium_prior_contract_v1
  action_contract_version: stage4_action_v2
  reward_contract_version: stage3_reward_v1
  policy_observation_keys: ["rgb", "lidar", "ego", "route"]
  auxiliary_observation_keys_available: ["quality_stats", "risk_stats", "route_commitment_stats", "sensor_dropout_mask"]
  baseline_consumes_auxiliary_inputs: false
  baseline_policy_input_rule: medium_prior_baselines_use_policy_observation_keys_only
  baseline_architecture_note: same_observation_architecture_ppo_using_rcs_ac_first_model_without_phase2_phase3_or_aux_policy_features_lowstd_smoke

model:
  action_dim: 2
  rgb_shape: [3, 90, 160]
  lidar_shape: [1, 64, 64]
  ego_dim: 5
  route_dim: 10
  feature_dim: 128
  fusion_dim: 128
  recurrent_hidden_dim: 256
  recurrent_layers: 1
  actor_hidden_dim: 256
  critic_hidden_dim: 256
  aux_hidden_dim: 128
  enable_rgb_perception_aux: false
  use_rgb_perception_actor_features: false
  rgb_perception_actor_feature_dim: 16
  rgb_perception_actor_adapter_init_std: 0.05
  use_scalar_actor_features: false
  scalar_actor_adapter_init_std: 0.0
  scalar_actor_lane_offset_scale: 1.0
  scalar_actor_heading_error_scale: 10.0
  scalar_actor_route_y_scale: 1.0
  aux_mask_height: 45
  aux_mask_width: 80
  aux_perception_hidden_channels: 64
  auxiliary_dim: 30
  quality_stats_dim: 15
  risk_stats_dim: 6
  route_commitment_stats_dim: 5
  sensor_dropout_dim: 4
  reliability_hidden_dim: 64
  risk_hidden_dim: 64
  risk_context_dim: 64
  reliability_min: 0.02
  reliability_max: 1.0
  log_std_init_by_dim: [-2.0, -2.0]
  min_std_by_dim: [0.03, 0.03]
  max_std_by_dim: [0.20, 0.25]
  enable_reliability: false
  enable_risk_context: false
  enable_shapley: false
  enable_dropout_consistency: false

fusion:
  temperature: 1.0
  route_weight_floor: 0.08
  ego_weight_floor: 0.05
  contribution_bias_scale: 0.0
  risk_context_dim: 64
  reliability_logit_scale: 1.0
  risk_logit_scale: 0.5
  use_risk_context: false

loss:
  value_loss_weight: 0.5
  entropy_loss_weight: 0.001
  aux_lane_offset_loss_weight: 0.0
  aux_heading_error_loss_weight: 0.0
  aux_road_mask_loss_weight: 0.0
  aux_lane_edge_mask_loss_weight: 0.0
  aux_lane_edge_pos_weight: 3.0
  reliability_loss_weight: 0.0
  risk_supervision_loss_weight: 0.0
  risk_regularization_weight: 0.0
  shapley_alignment_loss_weight: 0.0
  dropout_consistency_loss_weight: 0.0

shapley:
  enabled: false
  value_source: current_critic
  contribution_temperature: 1.0
  subsets_per_sample: 1
  batch_fraction: 0.25
  min_contribution: 0.0

dropout_consistency:
  enabled: false
  mode: representation_mask
  batch_fraction: 0.25
  action_mean_weight: 0.0
  value_weight: 0.0

ppo:
  learning_rate: 0.0001
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  update_epochs: 1
  minibatch_size: 64
  max_grad_norm: 0.5

env:
  weather: default
  traffic_mode: none
  traffic_vehicle_count: 0
  traffic_seed: 7
  route_representation: target_xy_plus_two_distance_heading_plus_third_heading_plus_turn_delta_plus_maneuver_hint_v1
  route_lookahead_count: 3
  maneuver_command_enabled: true
  maneuver_command_mode: cycle
  maneuver_command_values: ["straight", "left", "right"]
  rgb_sensor:
    image_size_x: 800
    image_size_y: 450
    fov: 100
    sensor_tick: 0.0
  lidar_sensor:
    channels: 16
    range: 40.0
    rotation_frequency: 20.0
    points_per_second: 20000
    upper_fov: 10.0
    lower_fov: -20.0
    sensor_tick: 0.0
  semantic_aux_camera_enabled: true
  semantic_sensor:
    image_size_x: 800
    image_size_y: 450
    fov: 100
    sensor_tick: 0.0
  aux_mask_width: 80
  aux_mask_height: 45
  image_every: 50
  client_timeout: 120.0
  route_length: 40
  route_spacing: 3.0
  stuck_speed_threshold_mps: 0.3
  stuck_min_steps: 70
  offroad_min_steps: 10
  offroad_grace_steps: 12
  offroad_lane_offset_threshold:
  goal_radius: 3.0
  suppress_conflicting_pedals: true
  low_speed_brake_suppression: true
  low_speed_brake_speed_threshold_kmh: 3.0
  low_speed_brake_max: 0.05
  longitudinal_control:
    mode: target_speed
    min_target_speed_kmh: 6.0
    max_target_speed_kmh: 28.0
    speed_deadband_kmh: 1.5
    throttle_kp: 0.075
    brake_kp: 0.05
    max_throttle: 0.48
    max_brake: 0.40
  action_smoothing:
    enabled: true
    steer_alpha: 0.75
    throttle_rise_limit: 0.08
    throttle_fall_limit: 0.25
    brake_rise_limit: 0.10
    brake_fall_limit: 0.25
  lateral_recovery:
    enabled: false
    turn_boost_enabled: false
  corruption:
    enabled: false
    mode: none
    level: 0.0

reward:
  progress_weight: 12.0
  progress_scale: 2.0
  dense_progress_distance_weight: 0.8
  dense_progress_positive_only: true
  lane_weight: 0.02
  lane_offset_penalty_weight: 0.04
  heading_error_penalty_weight: 0.005
  heading_recovery_reward_weight: 0.003
  speed_reward_weight: 0.45
  speed_reward_target_kmh: 8.0
  curve_heading_error_threshold: 7.0
  curve_speed_penalty_weight: 0.005
  curve_lane_offset_threshold: 0.5
  lane_offset_speed_penalty_weight: 0.010
  turn_speed_penalty_weight: 0.06
  turn_speed_delta_threshold_rad: 0.10
  turn_speed_free_kmh: 10.0
  turn_speed_use_junction_only: true
  junction_turn_lateral_speed_penalty_weight: 0.020
  junction_turn_lateral_speed_free_kmh: 6.0
  junction_turn_lateral_delta_threshold_rad: 0.18
  junction_turn_lateral_lane_threshold_m: 0.20
  junction_turn_lateral_heading_threshold_deg: 3.0
  collision_penalty: 10.0
  offroad_penalty: 5.0
  lane_invasion_penalty: 1.0
  steer_change_weight: 0.05
  throttle_change_weight: 0.02
  brake_change_weight: 0.02
  early_deadlock_penalty: 0.12
  early_deadlock_min_step: 40
  early_deadlock_progress_threshold: 0.06
  early_deadlock_speed_threshold_mps: 1.0
  early_deadlock_lane_offset_threshold_m: 0.35
  early_deadlock_heading_error_threshold_deg: 5.0
  no_progress_penalty: 0.07
  no_progress_speed_threshold_mps: 0.6
  no_progress_target_distance_threshold_m: 10.0
  no_progress_progress_epsilon: 0.002
  no_progress_distance_delta_epsilon_m: 0.12
  brake_hold_penalty: 0.022
  brake_hold_speed_threshold_mps: 0.3
  brake_hold_brake_threshold: 0.30
  brake_hold_target_distance_threshold_m: 1.5
  control_cost_scale: 0.12
  goal_bonus: 20.0
  stuck_penalty: 3.0
  stuck_penalty_scale: 0.3
  progress_delta_clip: 1.0

aux_target_normalization:
  lane_offset_divisor_m: 2.5
  lane_offset_clip_abs: 1.0
  heading_error_divisor_deg: 30.0
  heading_error_clip_abs: 1.0

bc_eval:
  corrective_route_min: 0.20
  corrective_route_max: 0.32
  corrective_abs_lane_offset_min: 1.8
  corrective_abs_heading_error_min: 6.0
  ppo_gate_max_offroad: 0
  ppo_gate_min_max_route: 0.30
  ppo_gate_min_mean_route: 0.0
  ppo_gate_max_action_jitter: 0.20
  ppo_gate_min_visual_zero_action_l1: 0.0
  ppo_gate_min_visual_zero_steer_delta: 0.0
  ppo_gate_min_corrective_count: 0
  ppo_gate_min_corrective_visual_zero_steer_delta: 0.0
  ppo_gate_min_corrective_sign_rate: 0.0
  ppo_gate_min_visual_center_correction_rate: 0.0
