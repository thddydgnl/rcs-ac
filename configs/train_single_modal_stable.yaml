model:
  obs_dim: 13
  action_dim: 3
  hidden_dim: 128
reward:
  progress_weight: 6.0
  lane_weight: 0.1
  collision_penalty: 10.0
  offroad_penalty: 5.0
  lane_invasion_penalty: 1.0
  steer_change_weight: 0.05
  throttle_change_weight: 0.02
  brake_change_weight: 0.02
  goal_bonus: 20.0
  stuck_penalty: 3.0
  progress_delta_clip: 1.0
ppo:
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
  update_epochs: 4
  minibatch_size: 64
