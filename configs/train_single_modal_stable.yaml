seed: 7
host: "127.0.0.1"
port: 2000
town: "Town04"
output_root: "outputs/ppo_single_modal_env"
logs_dir: "logs"
checkpoints_dir: "checkpoints"
run_name: "single_modal_stable"
model_type: "single_modal"
total_timesteps: 4096
rollout_steps: 128
max_episode_steps: 256
save_every_updates: 1
deterministic_eval: false
eval_episodes: 1
env:
  route_length: 40
  route_spacing: 3.0
  image_every: 50
  client_timeout: 30.0
