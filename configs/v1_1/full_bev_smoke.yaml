version: rcs_ac_v1_1
description: Sensor-derived Full BEV input smoke config. GT BEV is target-only.

model:
  use_full_bev: true
  rgb_shape: [3, 90, 160]
  bev_height: 128
  bev_width: 128
  bev_resolution_m: 0.375
  bev_front_m: 40.0
  bev_rear_m: 8.0
  bev_left_m: 24.0
  bev_right_m: 24.0
  bev_strict_extent_check: true
  bev_channels:
    rgb: 4
    lidar: 5
    route: 4
    ego: 3
    target: 5
  ego_scalar_dim: 6
  route_scalar_dim: 10
  sensor_health_dim: 15
  feature_dim: 128
  fusion_dim: 128
  waypoint_count: 4
  waypoint_mode: distance
  waypoint_distances_m: [2.0, 4.0, 6.0, 8.0]
  waypoint_gap_residual_scale_m: 0.75
  waypoint_min_gap_m: 0.75
  waypoint_max_lateral_m: 6.0
  waypoint_parameterization: monotonic_bounded
  min_target_speed_kmh: 0.0
  max_target_speed_kmh: 28.0
  use_bev_prediction_head: true

bev_spec:
  height: 128
  width: 128
  resolution_m: 0.375
  front_m: 40.0
  rear_m: 8.0
  left_m: 24.0
  right_m: 24.0
  strict_extent_check: true

policy_inputs:
  rgb: [3, 90, 160]
  lidar_bev: [5, 128, 128]
  route_bev: [4, 128, 128]
  ego_bev: [3, 128, 128]
  ego_scalar:
    - speed
    - yaw_rate
    - previous_steer
    - previous_longitudinal
    - route_progress
    - distance_to_next_turn
  route_scalar_dim: 10
  sensor_health_dim: 15

target_only:
  gt_bev_target: [5, 128, 128]
  expert_waypoints: [4, 2]
  expert_target_speed: [1]

bev_loss:
  enabled: true
  drivable_weight: 1.0
  lane_weight: 2.0
  obstacle_weight: 3.0
  free_space_weight: 1.0
  route_weight: 1.5

waypoint_loss:
  enabled: true
  waypoint_weight: 1.0
  target_speed_weight: 0.5

controller:
  type: speed_adaptive_pure_pursuit
  wheel_base_m: 2.85
  min_lookahead_m: 3.5
  max_lookahead_m: 12.0
  lookahead_base_m: 3.0
  lookahead_gain_per_mps: 0.45
  steer_lowpass_tau_s: 0.25
  max_steer_rate_per_s: 1.2
  speed_kp: 0.08
  speed_ki: 0.0
  speed_kd: 0.02
  max_throttle: 0.5
  max_brake: 0.4
  uncertainty_slowdown_threshold: 0.45
  uncertainty_stop_threshold: 0.85
  max_speed_under_high_uncertainty_kmh: 8.0
  min_uncertain_speed_kmh: 4.0
  invalid_path_target_speed_kmh: 0.0

anti_leakage:
  gt_bev_policy_input: false
  carla_actor_state_policy_input: false
