  v3_shapley_alignment_small:
    checkpoint_root: /Users/song-yonghwi/Documents/GitHub/RCS-AC_test/results/stage2_full/reference_freeze_backbone_plus_vision_ego_logit_triplet
    source_experiment_name: stage2_full
    loss_overrides:
      shapley_loss_coef: 0.02
      risk_loss_coef: 0.0
  v3_shapley_alignment_medium:
    checkpoint_root: /Users/song-yonghwi/Documents/GitHub/RCS-AC_test/results/stage2_full/reference_freeze_backbone_plus_vision_ego_logit_triplet
    source_experiment_name: stage2_full
    loss_overrides:
      shapley_loss_coef: 0.05
      risk_loss_coef: 0.0

train:
  total_steps: 4096
  rollout_steps: 512
  sequence_length: 16
  minibatch_num_sequences: 8
  learning_rate: 0.00005
  eval_interval_updates: 2

losses:
  actor_loss_coef: 1.0
  value_loss_coef: 0.5
  entropy_coef: 0.003
  reliability_loss_coef: 0.08
  consistency_loss_coef: 0.15
  shapley_loss_coef: 0.02
  risk_loss_coef: 0.0
  direct_target_drop_scale: 3.5
  vision_logit_retention_loss_coef: 0.03
  ego_logit_retention_loss_coef: 0.03
  vision_logit_retention_margin: 0.002
  ego_logit_retention_margin: 0.001
  shapley_temperature: 0.25
  shapley_num_states_per_minibatch: 4
  shapley_counterfactual_baseline: zero
  shapley_utility: fused_feature_l2_to_full

train_corruption:
  clean_probability: 0.55
  mild_single_probability: 0.35
  mild_mixed_probability: 0.10
  single_modality:
    - name: vision
      strength: 0.06
      weight: 1.0
    - name: distance
      strength: 0.06
      weight: 0.75
    - name: ego
      strength: 0.05
      weight: 1.0
    - name: route
      strength: 0.06
      weight: 0.75
  mixed:
    - name: mild_vision_route
      modalities: [vision, route]
      strengths: [0.05, 0.05]
    - name: mild_distance_ego
      modalities: [distance, ego]
      strengths: [0.05, 0.045]

eval_probes:
  - name: normal_eval
    kind: clean
    strength: 0.0
  - name: mild_vision
    kind: single
    modality: vision
    strength: 0.06
  - name: mild_distance
    kind: single
    modality: distance
    strength: 0.06
  - name: mild_ego
    kind: single
    modality: ego
    strength: 0.05
  - name: mild_route
    kind: single
    modality: route
    strength: 0.06
  - name: mild_vision_route
    kind: mixed
    modalities: [vision, route]
    strengths: [0.05, 0.05]
  - name: mild_distance_ego
    kind: mixed
    modalities: [distance, ego]
    strengths: [0.05, 0.045]

tiebreak_weights:
  normal_success: 5.0
  degradation: -2.0
  return_degradation: -1.0
  vision_delta: 1.0
  ego_delta: 1.0
  vision_logit_delta: 0.5
  ego_logit_delta: 0.5
  consistency_gain: 1.0
  alignment_kl_improvement: 1.0
  alignment_rank_corr_improvement: 1.0
  vision_shapley_delta: 0.5
  ego_shapley_delta: 0.5
  saturation_penalty: -1.0
  side_effect_penalty: -1.0
