  reference_stage2_full_locked_standard:
    checkpoint_root: /Users/song-yonghwi/Documents/GitHub/RCS-AC_test/results/stage2_full/reference_freeze_backbone_plus_vision_ego_logit_triplet
    source_experiment_name: stage2_full
    eval_only: true
