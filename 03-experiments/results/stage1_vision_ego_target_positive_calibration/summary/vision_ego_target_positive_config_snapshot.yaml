experiment_name: stage1_vision_ego_target_positive_calibration
output_root: /Users/song-yonghwi/Documents/GitHub/RCS-AC_test/results/stage1_vision_ego_target_positive_calibration
device: cpu
base_stage1_config_path: /Users/song-yonghwi/Documents/GitHub/RCS-AC_test/configs/stage1_warmup.yaml
base_checkpoint_root: /Users/song-yonghwi/Documents/GitHub/RCS-AC_test/results/stage1_reliability_objective_calibration/target_vs_nontarget_ranking_loss
reference_candidate_name: reference_target_vs_nontarget_ranking_loss
seeds:
- 0
- 1
- 2
num_eval_episodes: 20
base_config_overrides:
  model:
    reliability_hidden_dims:
    - 64
  warmup:
    use_direct_corruption_targets: true
    direct_target_drop_scale: 3.5
    weak_corruption_probability: 0.15
    weak_corruption_scale: 0.03
    mild_corruption_probability: 0.15
    mild_corruption_scale: 0.06
    reliability_loss_coef: 0.1
    target_ranking_loss_coef: 0.25
    target_ranking_margin: 0.05
    target_positive_margin_weak: 0.002
    target_positive_margin_mild: 0.004
    focus_vision_ego_pairing: true
train:
  total_steps: 8192
  eval_interval_updates: 2
  save_interval_updates: 4
scoring:
  weak_to_mild_margin_threshold: 0.001
probes:
  clean:
    corruption_type: clean
    corruption_strength: 0.0
  weak_vision:
    corruption_type: vision
    corruption_strength: 0.03
  weak_distance:
    corruption_type: distance
    corruption_strength: 0.03
  weak_ego:
    corruption_type: ego
    corruption_strength: 0.025
  weak_route:
    corruption_type: route
    corruption_strength: 0.03
  mild_vision:
    corruption_type: vision
    corruption_strength: 0.06
  mild_distance:
    corruption_type: distance
    corruption_strength: 0.06
  mild_ego:
    corruption_type: ego
    corruption_strength: 0.05
  mild_route:
    corruption_type: route
    corruption_strength: 0.06
candidate_order:
- reference_target_vs_nontarget_ranking_loss
- reference_plus_vision_target_positive_drop
- reference_plus_ego_target_positive_drop
- reference_plus_vision_ego_target_positive_drop
- reference_plus_vision_ego_positive_drop_plus_directional_monotonicity_small
- reference_plus_small_reliability_weight_up
candidates:
  reference_target_vs_nontarget_ranking_loss:
    round: A
    use_existing_checkpoint: true
  reference_plus_vision_target_positive_drop:
    round: A
    overrides:
      warmup:
        vision_target_positive_loss_coef: 0.35
        vision_margin_multiplier: 1.5
  reference_plus_ego_target_positive_drop:
    round: A
    overrides:
      warmup:
        ego_target_positive_loss_coef: 0.35
        ego_margin_multiplier: 1.5
  reference_plus_vision_ego_target_positive_drop:
    round: A
    overrides:
      warmup:
        vision_target_positive_loss_coef: 0.3
        ego_target_positive_loss_coef: 0.3
        vision_ego_margin_multiplier: 1.35
        vision_ego_weight_multiplier: 1.5
  reference_plus_vision_ego_positive_drop_plus_directional_monotonicity_small:
    round: B
    overrides:
      warmup:
        vision_target_positive_loss_coef: 0.3
        ego_target_positive_loss_coef: 0.3
        directional_monotonicity_loss_coef: 0.1
        vision_ego_margin_multiplier: 1.35
        vision_ego_weight_multiplier: 1.5
  reference_plus_small_reliability_weight_up:
    round: C
    overrides:
      warmup:
        reliability_loss_coef: 0.12
