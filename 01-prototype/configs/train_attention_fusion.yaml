seed: 7
host: "127.0.0.1"
port: 2000
town: "Town04"
output_root: "outputs/ppo_attention_fusion_env"
logs_dir: "logs"
checkpoints_dir: "checkpoints"
run_name: "attention_fusion_baseline"
model_type: "attention_fusion"
total_timesteps: 512
rollout_steps: 128
max_episode_steps: 128
save_every_updates: 1
eval_episodes: 1
env:
  route_length: 40
  route_spacing: 3.0
  image_every: 50
  client_timeout: 10.0
model:
  action_dim: 3
  hidden_dim: 256
  rgb_feature_dim: 64
  lidar_feature_dim: 32
  ego_feature_dim: 32
  route_feature_dim: 32
  attention_heads: 4
  attention_layers: 1
  dropout: 0.0
ppo:
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
  update_epochs: 4
  minibatch_size: 64
  deterministic_eval: true
